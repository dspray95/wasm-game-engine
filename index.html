<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WASM Game Engine</title>
<style>
  /* Make html and body take the full window */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* prevent scrollbars */
    background-color: black;
  }

  /* Canvas fills the full window */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="wgpu-canvas"></canvas>

<script>
  // No-op stubs so the WASM can always call these functions.
  // initFirebase() below overwrites them when Firebase loads successfully.
  window.fetchHighScores = async () => JSON.stringify([]);
  window.submitHighScore = async () => true;
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit,
  } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

  async function initFirebase() {
    let config;
    try {
      const response = await fetch("./firebase-config.json");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      config = await response.json();
    } catch (error) {
      console.warn("Firebase: failed to load firebase-config.json — remote scores disabled.", error);
      return;
    }

    const app = initializeApp(config);
    const db = getFirestore(app);

    window.fetchHighScores = async function (maxEntries) {
      const q = query(
        collection(db, "high_scores"),
        orderBy("score", "desc"),
        limit(maxEntries)
      );
      const snapshot = await getDocs(q);
      const entries = snapshot.docs.map((doc) => {
        const data = doc.data();
        return { initials: data.initials, score: data.score };
      });
      return JSON.stringify(entries);
    };

    window.submitHighScore = async function (initials, score) {
      await addDoc(collection(db, "high_scores"), {
        initials,
        score,
        timestamp: Date.now(),
      });
      return true;
    };
  }

  await initFirebase();

  // Called once by the WASM when the player presses [ENTER] to start the game
  // (the PreStart -> Playing transition). Hide any intro/landing DOM here.
  window.onGameStart = function () {
    // e.g. document.getElementById("intro")?.remove();
  };

  import init, { start } from './pkg/wasm_game_engine.js';
  init().then(() => {
    start();
  });
</script>
</body>
</html>
