[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "citizen_engine"
path = "src/main.rs"

[package]
name = "wasm_game_engine"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30.5", features = ["serde"] }
wgpu = "29.0.3"
env_logger = "0.11.5"
log = "0.4"
pollster = "0.4.0"
bytemuck = { version = "1.7.0", features = ["derive"] }
cgmath = { version = "0.18", features = ["serde"] }
cfg-if = "1"
tobj = { version = "3.2", default-features = false, features = ["async"]}
noise = "0.9.0"
rand = "0.9.1"
web-time = "1.1.0"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
erased-serde = "0.4.10"
egui = "0.34.2"
egui-wgpu = "0.34.2"
egui-winit = { version = "0.34.2", default-features = false, features = ["links"] }
egui_styled = { path = "/home/david/repos/egui_styled" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
egui-winit = { version = "0.34.2", features = ["clipboard", "wayland", "x11"] }

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[dependencies.image]
version = "0.25.5"
default-features = false
features = ["jpeg", "png"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "29.0.3", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
    "HtmlCanvasElement",
    'console'
]}
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = "0.12"
web-time = "1.1.0"
